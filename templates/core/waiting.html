<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouverture Prochaine | Prof Chez Vous</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 100%);
            font-family: 'Raleway', sans-serif;
            color: #1e293b;
            text-align: center;
        }
        
        .container {
            background: #ffffff;
            padding: 4rem 3rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
            border: 1px solid #e2e8f0;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #16a34a;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.25);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .date-badge {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border: 1px solid #bbf7d0;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #475569;
            margin: 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 3rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">
            <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            </svg>
        </div>
        
        <h1>Prof Chez Vous</h1>
        
        <div class="date-badge">Ouverture officielle le 15 Juin 2026</div>
        
        <p>Nous préparons un espace dédié à la réussite de vos enfants et à la valorisation de nos enseignants.</p>
    </div>
</body>
</html>
