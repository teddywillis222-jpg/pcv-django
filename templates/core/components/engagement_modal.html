<!-- Modal Engagement Dynamique -->
<div id="engagementModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 4000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: white; border-radius: 1rem; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
        <div style="padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 20;">
            <div>
                <h3 style="font-size: 1.25rem; font-weight: 700; color: #1e293b; margin: 0;">Proposer un engagement</h3>
                <div id="eng_prof_display" style="font-size: 0.9rem; color: #64748b; margin-top: 0.25rem; font-weight: 500;"></div>
            </div>
            <button type="button" onclick="closeEngagementModal()" style="background: #f1f5f9; border: none; cursor: pointer; color: #64748b; padding: 0.5rem; border-radius: 50%; transition: all 0.2s;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        
        <!-- Bannière dynamique d'essai (TOUJOURS EN HAUT) -->
        <div id="eng_banner" style="display: none; padding: 1rem 1.5rem; background: #f0fdf4; border-bottom: 1px solid #dcfce7; font-size: 0.95rem; color: #166534;">
            <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
                <div style="background: #16a34a; color: white; padding: 0.25rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <div>
                    <p id="eng_banner_text" style="margin: 0; line-height: 1.4; font-weight: 600;"></p>
                    <a id="eng_banner_btn" href="#" style="display: none; margin-top: 0.4rem; font-weight: 700; text-decoration: underline; color: #166534; font-size: 0.85rem;">Passer en Premium pour en bénéficier</a>
                </div>
            </div>
        </div>

        <form id="engagementForm" onsubmit="submitEngagement(event)" style="padding: 1.5rem;">
            <input type="hidden" id="eng_teacher_id" name="teacher_id">
            <input type="hidden" id="eng_teacher_name_hidden" name="teacher_name">
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Type d'engagement <span style="color:#ef4444">*</span></label>
                <select id="eng_type" name="engagement_type" onchange="toggleEngagementFields()" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; cursor: pointer; font-weight: 600; color: #1e293b; transition: border-color 0.2s;" required>
                    <option value="standard">Engagement Standard (Cours réguliers)</option>
                    <option value="essai">Engagement d'Essai (Cours de test unique)</option>
                </select>
                <p id="eng_type_notice" style="display: none; margin-top: 0.5rem; font-size: 0.8rem; color: #ef4444; font-weight: 500;">L'option essai requiert un abonnement Access+ Premium.</p>
            </div>

            <!-- Champs Communs -->
            <div id="eng_field_enfants" style="margin-bottom: 1.25rem; display: none;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Élève / Enfant bénéficiaire <span style="color:#ef4444">*</span></label>
                <select id="eng_enfant_id" name="enfant_id" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-weight: 500;" required>
                    <!-- Rempli par JS -->
                </select>
            </div>

            <div class="eng-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Matière <span style="color:#ef4444">*</span></label>
                    <select id="eng_matiere" name="matiere" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-weight: 500;" required>
                        <!-- Rempli par JS -->
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Classe de l'élève <span style="color:#ef4444">*</span></label>
                    <select id="eng_classe" name="classe" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-weight: 500;" required>
                        <!-- Rempli par JS -->
                    </select>
                </div>
            </div>
            
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Mode de cours <span style="color:#ef4444">*</span></label>
                <select id="eng_mode" name="course_mode" onchange="toggleModeFields()" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-weight: 500;" required>
                    <option value="">Sélectionnez le mode de cours</option>
                    <option value="PARENT_HOME">Présentiel chez le parent</option>
                    <option value="APPRENANT_HOME">Présentiel chez l'apprenant</option>
                    <option value="ONLINE">En ligne (visioconférence)</option>
                    <option value="HYBRID">Hybride (Présentiel + En ligne)</option>
                    <option value="THIRD_PLACE">Lieu tiers (bibliothèque, centre éducatif)</option>
                    <option value="SMALL_GROUP">Cours en groupe restreint</option>
                    <option value="DISTANCE">À distance (téléphone, audio)</option>
                </select>
            </div>

            <div id="eng_field_localisation" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Localisation (Quartier/Ville) <span style="color:#ef4444">*</span></label>
                <select id="eng_localisation" name="localisation" class="pcv-multi-select" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-weight: 500;">
                    <option value="">Sélectionnez un quartier-ville</option>
                    {% for code, label in LOCALISATION_CHOICES %}
                    <option value="{{ code }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="eng_field_visio" style="margin-bottom: 1.25rem; display: none;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Plateforme visio préférée</label>
                <select name="plateforme_visio" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff;">
                    <option value="">Sélectionnez une plateforme</option>
                    <option value="zoom">Zoom</option>
                    <option value="google_meet">Google Meet</option>
                    <option value="teams">Microsoft Teams</option>
                    <option value="whatsapp">WhatsApp Visio</option>
                </select>
            </div>

            <!-- Champs Spécifiques STANDARD -->
            <div id="eng_group_standard">
                <div class="eng-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Fréquence <span style="color:#ef4444">*</span></label>
                        <select id="eng_frequence" name="frequence" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff;">
                            <option value="1">1 séance / semaine</option>
                            <option value="2">2 séances / semaine</option>
                            <option value="3">3 séances / semaine</option>
                            <option value="4">4 séances / semaine</option>
                            <option value="5">5 séances / semaine</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Durée par séance <span style="color:#ef4444">*</span></label>
                        <select id="eng_duree" name="duree_seance" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff;">
                            <option value="1H">1h</option>
                            <option value="1H30">1h30</option>
                            <option value="2H">2h</option>
                            <option value="2H30">2h30</option>
                            <option value="3H">3h</option>
                        </select>
                    </div>
                </div>

                <div class="eng-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Date de début souhaitée <span style="color:#ef4444">*</span></label>
                        <input type="date" name="date_debut" id="eng_date_debut" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Durée totale (mois) <span style="color:#ef4444">*</span></label>
                        <input type="number" id="eng_duree_mois" name="duree_mois" min="1" max="12" placeholder="Ex: 3" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem;">
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Budget proposé (FCFA / séance) <span style="color:#ef4444">*</span></label>
                    <input type="number" name="budget" placeholder="Indiquez le prix par séance souhaité" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem;" required>
                </div>
            </div>

            <!-- Champs Spécifiques ESSAI -->
            <div id="eng_group_essai" style="display: none; background: #f8fafc; padding: 1.25rem; border-radius: 1rem; border: 2px dashed #cbd5e1; margin-bottom: 1.5rem;">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Date et Heure de l'essai souhaitée <span style="color:#ef4444">*</span></label>
                    <input type="datetime-local" id="eng_date_essai" name="date_essai" style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #334155;">Précisions pour l'essai</label>
                    <textarea name="description_essai" rows="3" placeholder="Précisez un lieu de rencontre, vos attentes spécifiques pour ce test..." style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; resize: vertical; font-family: inherit;"></textarea>
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem; position: sticky; bottom: 0; background: white; padding-top: 1rem; z-index: 10; border-top: 1px solid #f1f5f9;">
                <button type="button" onclick="closeEngagementModal()" style="flex: 1; padding: 1rem; background: #f1f5f9; color: #475569; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s;">
                    Annuler
                </button>
                <button type="submit" id="eng_submit_btn" style="flex: 2; padding: 1rem; background: #16a34a; color: white; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);">
                    Envoyer la proposition
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Succès Engagement -->
<div id="engagementSuccessModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: white; border-radius: 1.5rem; width: 100%; max-width: 450px; text-align: center; padding: 2.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);">
        <div style="width: 70px; height: 70px; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h3 style="font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 0.75rem;">Proposition envoyée !</h3>
        <p style="color: #64748b; margin-bottom: 2rem; line-height: 1.6;">Votre proposition d'engagement a été soumise avec succès. Le professeur a été notifié et vous répondra très bientôt.</p>
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a id="btn_go_dashboard" href="#" style="padding: 1rem; background: #16a34a; color: white; border-radius: 0.75rem; font-weight: 700; text-decoration: none; transition: transform 0.2s;">Accéder à mon espace</a>
            <button onclick="document.getElementById('engagementSuccessModal').style.display='none'" style="padding: 1rem; background: #f1f5f9; color: #475569; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer;">Rester sur cette page</button>
        </div>
    </div>
</div>

<style>
@keyframes scaleIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
#engagementModal input:focus, #engagementModal select:focus, #engagementModal textarea:focus {
    outline: none;
    border-color: #16a34a !important;
    box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1);
}
</style>

<script>
// Logic for engagement modal (used in both search and detail pages)
let currentTeacherData = {};

function openEngagementFromTrial(trialData) {
    // Cette fonction permet de convertir un essai en engagement standard
    document.getElementById('eng_teacher_id').value = trialData.teacher_id;
    document.getElementById('eng_prof_display').textContent = 'Prof. ' + trialData.teacher_name;
    document.getElementById('eng_teacher_name_hidden').value = trialData.teacher_name;
    
    currentTeacherData = { 
        is_parent: true, 
        is_premium: true, 
        essai_actif: false,
        children: [{id: trialData.student_id, prenom: trialData.student_name}],
        existing_engagement: null,
        classes: trialData.classe ? [trialData.classe] : []
    };

    // Gérer l'enfant
    const enfantSelect = document.getElementById('eng_enfant_id');
    enfantSelect.innerHTML = '';
    const opt = new Option(trialData.student_name, trialData.student_id, true, true);
    enfantSelect.add(opt);
    enfantSelect.disabled = true;
    document.getElementById('eng_field_enfants').style.display = 'block';

    // Gérer la matière
    const matiereSelect = document.getElementById('eng_matiere');
    matiereSelect.innerHTML = '';
    matiereSelect.add(new Option(trialData.matiere, trialData.matiere, true, true));
    matiereSelect.disabled = true;

    // Gérer la classe
    const classeSelect = document.getElementById('eng_classe');
    classeSelect.innerHTML = '';
    if (trialData.classe) {
        classeSelect.add(new Option(trialData.classe, trialData.classe, true, true));
    }
    classeSelect.disabled = true;

    document.getElementById('engagementForm').reset();
    
    const typeSelect = document.getElementById('eng_type');
    typeSelect.value = 'standard';
    for(let i=0; i<typeSelect.options.length; i++) {
        if(typeSelect.options[i].value === 'essai') typeSelect.options[i].disabled = true;
    }
    typeSelect.disabled = true;

    document.getElementById('eng_mode').value = trialData.mode_raw || 'domicile';
    if (trialData.lieu) {
        document.getElementById('eng_localisation').value = trialData.lieu;
    }

    document.getElementById('eng_submit_btn').textContent = 'Finaliser l\'engagement';
    
    toggleEngagementFields();
    document.getElementById('engagementModal').style.display = 'flex';
}

function openEngagementForm(teacherId, teacherName, matiere, isParent = false, isPremium = false, essaiActif = false, children = [], existingEng = null, classesStr = '') {
    requireAuth(() => {
        document.getElementById('engagementForm').reset();
        
        document.getElementById('eng_teacher_id').value = teacherId;
        document.getElementById('eng_prof_display').textContent = 'Prof. ' + teacherName;
        document.getElementById('eng_teacher_name_hidden').value = teacherName;
        
        const classes = classesStr ? classesStr.split(',').map(c => c.trim()) : [];
        
        currentTeacherData = { 
            is_parent: isParent, 
            is_premium: isPremium, 
            essai_actif: essaiActif,
            children: children,
            existing_engagement: existingEng,
            classes: classes
        };

        // Gérer le dropdown des enfants
        const enfantSelect = document.getElementById('eng_enfant_id');
        enfantSelect.innerHTML = '';
        if (children && children.length > 0) {
            document.getElementById('eng_field_enfants').style.display = 'block';
            if (children.length === 1) {
                const opt = new Option(children[0].prenom, children[0].id, true, true);
                enfantSelect.add(opt);
                enfantSelect.disabled = true;
            } else {
                enfantSelect.add(new Option('Sélectionnez un enfant', ''));
                children.forEach(c => enfantSelect.add(new Option(c.prenom, c.id)));
                enfantSelect.disabled = false;
            }
        } else {
            document.getElementById('eng_field_enfants').style.display = 'none';
        }

        // Gérer le dropdown des matières
        const matiereSelect = document.getElementById('eng_matiere');
        matiereSelect.innerHTML = '';
        const matList = matiere.split(',').map(s => s.trim()).filter(s => s !== '');
        if (matList.length === 1) {
            matiereSelect.add(new Option(matList[0], matList[0], true, true));
            matiereSelect.disabled = true;
        } else {
            matiereSelect.add(new Option('Sélectionnez une matière', ''));
            matList.forEach(m => matiereSelect.add(new Option(m, m)));
            matiereSelect.disabled = false;
        }

        // Gérer le dropdown des classes
        const classeSelect = document.getElementById('eng_classe');
        classeSelect.innerHTML = '';
        const classMap = {'6EME': '6ème', '5EME': '5ème', '4EME': '4ème', '3EME': '3ème', '2NDE': '2nde', '1ERE': '1ère', 'TLE': 'Terminale'};
        if (classes.length > 0) {
            if (classes.length === 1) {
                const label = classMap[classes[0]] || classes[0];
                classeSelect.add(new Option(label, classes[0], true, true));
                classeSelect.disabled = true;
            } else {
                classeSelect.add(new Option('Sélectionnez la classe', ''));
                classes.forEach(c => {
                    const label = classMap[c] || c;
                    classeSelect.add(new Option(label, c));
                });
                classeSelect.disabled = false;
            }
        } else {
            // Toutes les classes si vide
            classeSelect.add(new Option('Sélectionnez la classe', ''));
            Object.keys(classMap).forEach(c => classeSelect.add(new Option(classMap[c], c)));
            classeSelect.disabled = false;
        }
        
        // Gérer la bannière d'essai (TOUJOURS VISIBLE SI PROF LE PROPOSE)
        const banner = document.getElementById('eng_banner');
        const bannerText = document.getElementById('eng_banner_text');
        const bannerBtn = document.getElementById('eng_banner_btn');
        const typeSelect = document.getElementById('eng_type');
        const typeNotice = document.getElementById('eng_type_notice');

        if (essaiActif) {
            banner.style.display = 'block';
            if (isPremium) {
                bannerText.textContent = "Ce professeur propose un essai gratuit. Vous pouvez sélectionner 'Engagement d'Essai' ci-dessous.";
                bannerBtn.style.display = 'none';
                typeNotice.style.display = 'none';
                // Activer l'option essai
                for(let i=0; i<typeSelect.options.length; i++) {
                    if(typeSelect.options[i].value === 'essai') typeSelect.options[i].disabled = false;
                }
            } else {
                bannerText.textContent = "Ce professeur propose un essai gratuit aux membres Access+ Premium.";
                bannerBtn.style.display = 'inline-block';
                bannerBtn.href = "{% url 'gestion_plan' %}"; // Lien vers abonnement
                typeNotice.style.display = 'block';
                // Désactiver l'option essai
                typeSelect.value = 'standard';
                for(let i=0; i<typeSelect.options.length; i++) {
                    if(typeSelect.options[i].value === 'essai') typeSelect.options[i].disabled = true;
                }
            }
        } else {
            banner.style.display = 'none';
            typeNotice.style.display = 'none';
            typeSelect.value = 'standard';
            for(let i=0; i<typeSelect.options.length; i++) {
                if(typeSelect.options[i].value === 'essai') typeSelect.options[i].disabled = true;
            }
        }

        // Pré-remplissage si un engagement existe déjà
        if (existingEng && existingEng.status === 'EN_ATTENTE') {
            document.querySelector('#engagementModal h3').textContent = 'Modifier ma proposition';
            typeSelect.value = existingEng.type || 'standard';
            matiereSelect.value = existingEng.matiere;
            if (existingEng.classe) classeSelect.value = existingEng.classe;
            document.getElementById('eng_mode').value = existingEng.mode_de_cours || 'PARENT_HOME';
            if (document.getElementById('eng_frequence')) document.getElementById('eng_frequence').value = existingEng.frequence || '1';
            if (document.getElementById('eng_duree')) document.getElementById('eng_duree').value = existingEng.duree || '1H';
            
            document.getElementById('eng_submit_btn').textContent = 'Mettre à jour la proposition';
        } else {
            document.querySelector('#engagementModal h3').textContent = 'Proposer un engagement';
            document.getElementById('eng_submit_btn').textContent = 'Envoyer la proposition';
        }

        typeSelect.disabled = false; // Par défaut
        
        toggleEngagementFields();
        document.getElementById('engagementModal').style.display = 'flex';
    });
}

function closeEngagementModal() {
    document.getElementById('engagementModal').style.display = 'none';
}

function toggleModeFields() {
    const mode = document.getElementById('eng_mode').value;
    const visioField = document.getElementById('eng_field_visio');
    const locField = document.getElementById('eng_field_localisation');
    const locInput = document.getElementById('eng_localisation');

    if (mode === 'ONLINE') {
        visioField.style.display = 'block';
        locField.style.display = 'none';
        locInput.required = false;
    } else {
        visioField.style.display = 'none';
        locField.style.display = 'block';
        locInput.required = true;
    }
}

function toggleEngagementFields() {
    const type = document.getElementById('eng_type').value;
    const stdGroup = document.getElementById('eng_group_standard');
    const essaiGroup = document.getElementById('eng_group_essai');
    const submitBtn = document.getElementById('eng_submit_btn');

    // Reset required
    stdGroup.querySelectorAll('input, select').forEach(el => el.required = false);
    document.getElementById('eng_date_essai').required = false;

    if (type === 'essai') {
        stdGroup.style.display = 'none';
        essaiGroup.style.display = 'block';
        document.getElementById('eng_date_essai').required = true;
        
        // Vérifier si autorisé (double sécurité)
        if (!currentTeacherData.is_premium) {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.5';
            submitBtn.title = "Access+ Premium requis";
        } else {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.title = "";
        }
    } else {
        stdGroup.style.display = 'block';
        essaiGroup.style.display = 'none';
        
        document.getElementById('eng_frequence').required = true;
        document.getElementById('eng_duree').required = true;
        document.getElementById('eng_date_debut').required = true;
        document.getElementById('eng_duree_mois').required = true;
        
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.title = "";
    }

    // Gérer le required de l'enfant uniquement si parent
    const enfantSelect = document.getElementById('eng_enfant_id');
    if (currentTeacherData.is_parent && currentTeacherData.children && currentTeacherData.children.length > 0) {
        enfantSelect.required = true;
    } else {
        enfantSelect.required = false;
    }

    toggleModeFields();
}

async function submitEngagement(event) {
    event.preventDefault();
    const form = event.target;
    
    // Validation stricte avant envoi
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    
    const btn = document.getElementById('eng_submit_btn');
    if (btn.disabled) return;
    
    // Récupérer les selects désactivés car FormData les ignore
    const disabledInputs = form.querySelectorAll('select:disabled');
    disabledInputs.forEach(input => input.disabled = false);
    
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    // Re-désactiver après capture
    disabledInputs.forEach(input => input.disabled = true);
    
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Envoi...';
    
    try {
        const response = await fetch('/api/engagement/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            closeEngagementModal();
            if (typeof closeSidePanel === 'function') closeSidePanel();
            
            const successModal = document.getElementById('engagementSuccessModal');
            const dashBtn = document.getElementById('btn_go_dashboard');
            
            const isParent = currentTeacherData && currentTeacherData.is_parent;
            dashBtn.href = isParent ? '/parent/dashboard/' : '/apprenant/dashboard/';
            
            successModal.style.display = 'flex';
        } else {
            alert(result.error || 'Erreur lors de l\'envoi');
        }
    } catch(e) {
        alert('Erreur de connexion réseau. Veuillez réessayer.');
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
